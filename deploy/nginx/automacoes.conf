# /etc/nginx/sites-available/automacoes
# SSL: certbot --nginx -d automacoes.mayacorp.com.br -d hml-automacoes.mayacorp.com.br
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# ---------- Produção
server {
    server_name automacoes.mayacorp.com.br;
    client_max_body_size 25m;
    location = /cfme { return 301 /; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE do progresso dos lotes: sem buffer, conexão longa
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    listen 80;
}

# ---------- Homologação
server {
    server_name hml-automacoes.mayacorp.com.br;
    client_max_body_size 25m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    listen 80;
}
