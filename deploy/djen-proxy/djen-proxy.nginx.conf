# Proxy do DJEN no Brasil para o MayaJus.
# O DJEN (comunicaapi.pje.jus.br) recusa IPs fora do Brasil e o servidor do MayaJus fica nos EUA.
# Este site roda num servidor NO BRASIL e só repassa GET para o DJEN, somente para o IP do servidor do MayaJus.
#
# Instalar (no servidor do Brasil):  ver instalar.sh
# Depois: Configurações › Tribunais › Plataforma › "Proxy do DJEN" = https://__DOMINIO__/__SEGREDO__/api/v1

limit_req_zone $binary_remote_addr zone=djen_proxy:1m rate=30r/m;

server {
    listen 80;
    server_name __DOMINIO__;

    location = / { return 404; }

    location /__SEGREDO__/api/v1/ {
        allow 2.25.130.240;   # servidor do MayaJus (Hostinger srv1703721)
        deny all;
        limit_except GET { deny all; }
        limit_req zone=djen_proxy burst=10;

        proxy_pass https://comunicaapi.pje.jus.br/api/v1/;
        proxy_set_header Host comunicaapi.pje.jus.br;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
        access_log /var/log/nginx/djen-proxy.access.log;
    }

    location / { return 404; }
}
